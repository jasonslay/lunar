[package]
name = "lunar"
version = "0.1.2"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "lunar"
path = "src/main.rs"

[features]
default = ["native"]
# png stays native-only so README screenshot capture still works.
native = ["bevy/x11", "bevy/wayland", "bevy/multi_threaded", "bevy/png"]
web = ["bevy/webgl2"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "web",
] }
glam = "0.32"
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
