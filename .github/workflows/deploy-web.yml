name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  TRUNK_VERSION: "0.21.14"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-wasm
          cache-all-crates: "true"
          cache-on-failure: true

      - name: Cache trunk tools
        uses: actions/cache@v5
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ env.TRUNK_VERSION }}

      - name: Install trunk
        run: |
          curl -fsSL -o /tmp/trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/trunk.tar.gz -C /tmp
          install -m 755 /tmp/trunk "$CARGO_HOME/bin/trunk"
          trunk --version

      - name: Build web bundle
        run: env -u NO_COLOR trunk build --release

      - name: Package web release
        run: tar -C dist -czf lunar-web.tar.gz .

      # Semver tag from Cargo.toml (e.g. v0.1.0). Bump version to cut a new
      # release; same version re-uploads the asset. jtslay.com pulls latest.
      - name: Publish web release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Could not parse semver from Cargo.toml (got: '${version}')" >&2
            exit 1
          fi
          tag="v${version}"
          notes="Release \`${tag}\` from \`${GITHUB_SHA}\`.

          Asset \`lunar-web.tar.gz\` is consumed by [jtslay.com](https://jtslay.com/lunar/)."
          echo "Publishing ${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" lunar-web.tar.gz --clobber
            gh release edit "${tag}" --target "${GITHUB_SHA}" --notes "${notes}" --latest
          else
            gh release create "${tag}" lunar-web.tar.gz \
              --title "${tag}" \
              --notes "${notes}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

      # Optional: set JTSLAY_COM_DISPATCH_TOKEN (PAT with repo scope on jasonslay/jtslay.com)
      # so lunar pushes also redeploy https://jtslay.com/lunar/
      - name: Trigger jtslay.com redeploy
        env:
          DISPATCH_TOKEN: ${{ secrets.JTSLAY_COM_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "JTSLAY_COM_DISPATCH_TOKEN not set; skipping jtslay.com redeploy"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jasonslay/jtslay.com/dispatches \
            -d "{\"event_type\":\"lunar-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
